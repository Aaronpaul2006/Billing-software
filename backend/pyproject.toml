[project]
name = "billing-backend"
version = "0.1.0"
description = "Construction billing platform: REST API (Django + DRF)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django[argon2]>=5.2.18,<5.3",  # LTS
    "djangorestframework>=3.18",
    "drf-spectacular>=0.30",
    "psycopg[binary]>=3.3",
    "django-environ>=0.14",
    "redis>=8.1",
    "pyjwt>=2.15",
    "pyotp>=2.10",
    "cryptography>=46",
    "django-filter>=26.2",
    "celery>=5.5",
    "weasyprint>=66",
    "boto3>=1.40",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    "gunicorn>=26.2.0",
    "sentry-sdk[celery,django]>=2.72.0",
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "ruff>=0.17",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
    "pytest>=9.1",
    "pytest-django>=4.14",
    "pip-audit>=2.10",
    "types-django-filter>=26.1.0.20260713",
    "hypothesis>=6.140",
    "moto[s3]>=5.1",
    "boto3-stubs[s3]>=1.40",
    "types-openpyxl>=3.1.5.20261017",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.uv]
package = false

# --- ruff --------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
# Generated by makemigrations (the RunSQL ones are copied SQL); not linted.
extend-exclude = ["apps/*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "DJ",            # django
    "DTZ",           # no naive datetimes
    "N",             # naming
    "SIM",           # simplify
    "PT",            # pytest style
    "RUF",
]
ignore = [
    "DJ008",  # __str__ on every model: no admin site; add where useful
    "N818",   # exception names follow DRF (NotFound, PermissionDenied), no Error suffix
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "E501", "RUF001", "RUF003", "N817"]  # asserts, fake data, × and D = Decimal in money tests
"config/settings/*.py" = ["F405", "F403"]  # star import of base settings
"apps/*/models.py" = ["RUF012"]  # Django's Meta.constraints / indexes lists

# --- mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^\\.venv/", "/migrations/"]  # generated by makemigrations

[[tool.mypy.overrides]]
module = ["environ.*", "celery", "celery.*", "weasyprint", "weasyprint.*"]  # no type information published
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
