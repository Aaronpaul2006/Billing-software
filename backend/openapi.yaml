    ToEnum:
      enum:
      - PROFORMA
      - TAX_INVOICE
      - BILL_OF_SUPPLY
      type: string
      description: |-
        * `PROFORMA` - PROFORMA
        * `TAX_INVOICE` - TAX_INVOICE
        * `BILL_OF_SUPPLY` - BILL_OF_SUPPLY
    Tokens:
      type: object
      properties:
        token_type:
          type: string
          description: Always `Bearer`.
        access_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        session_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        role:
          type: string
        mfa_enrollment_required:
          type: boolean
          description: 'OWNER/ADMIN without MFA: only enrolment endpoints work until
            it is on.'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantSummary'
        refresh_token:
          type: string
          description: Mobile clients only; web clients get an HttpOnly cookie.
        refresh_expires_at:
          type: string
          format: date-time
      required:
      - access_token
      - expires_in
      - mfa_enrollment_required
      - role
      - session_id
      - tenant_id
      - tenants
      - token_type
      - user_id
    Totals:
      type: object
      properties:
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        cgst:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        sgst:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        igst:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        cess:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        round_off:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        retention:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        income_tax_tds:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        gst_tds:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        advance_recovery:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        net_receivable:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        amount_settled:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        outstanding:
          type: string
          readOnly: true
      required:
      - advance_recovery
      - cess
      - cgst
      - grand_total
      - gst_tds
      - igst
      - income_tax_tds
      - net_receivable
      - outstanding
      - retention
      - round_off
      - sgst
      - subtotal
    Void:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 3
      required:
      - reason
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /auth/login, /auth/mfa/verify or /auth/token/refresh
        (10 minutes). The tenant is the token's `tid` claim.
