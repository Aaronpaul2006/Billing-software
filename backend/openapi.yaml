components:
  schemas:
    Address:
      type: object
      properties:
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        state_code:
          $ref: '#/components/schemas/StateCodeEnum'
        pincode:
          type: string
          maxLength: 6
      required:
      - city
      - line1
      - pincode
      - state_code
    AddressOut:
      type: object
      description: |-
        For responses: a stored address with missing keys (seeded or imported
        data) is shown as it is instead of failing the whole response.
      properties:
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        state_code:
          $ref: '#/components/schemas/StateCodeEnum'
        pincode:
          type: string
          maxLength: 6
    Allocate:
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationIn'
      required:
      - allocations
    AllocationIn:
      type: object
      description: 'Settles a document or (payments only) a retention release: one
        of the two.'
      properties:
        document_id:
          type: string
          format: uuid
        retention_release_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - amount
    AllocationOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document_id:
          type:
          - string
          - 'null'
          format: uuid
        doc_number:
          type:
          - string
          - 'null'
          readOnly: true
        retention_release_id:
          type:
          - string
          - 'null'
          format: uuid
        payment_id:
          type:
          - string
          - 'null'
          format: uuid
        credit_note_id:
          type:
          - string
          - 'null'
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - credit_note_id
      - doc_number
      - document_id
      - id
      - payment_id
      - retention_release_id
    BoqImportRequest:
      type: object
      properties:
        file:
          type: string
          format: uri
          description: CSV (UTF-8) or .xlsx, at most 5 MB and 5,000 rows.
        dry_run:
          type: boolean
          default: false
          description: Validate and preview; save nothing.
      required:
      - file
    BoqImportResult:
      type: object
      properties:
        dry_run:
          type: boolean
        count:
          type: integer
        skipped_rows:
          type: array
          items:
            type: integer
          description: Heading / subtotal rows (no unit, qty, rate).
        ignored_columns:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/BoqItem'
          description: 'In a dry run, a preview: id, created_at and updated_at are
            null.'
      required:
      - count
      - dry_run
      - ignored_columns
      - items
      - skipped_rows
    BoqItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project_id:
          type: string
          format: uuid
        item_code:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
        sac_hsn:
          type:
          - string
          - 'null'
          readOnly: true
        contract_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        rate:
          type: string
          format: decimal
