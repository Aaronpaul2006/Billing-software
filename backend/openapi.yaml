    TdsCertificate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
        party_id:
          type: string
          format: uuid
        deductor_tan:
          type: string
          readOnly: true
        section:
          type: string
          readOnly: true
        fy_start_year:
          type: integer
          readOnly: true
        quarter:
          type: integer
          readOnly: true
        certificate_number:
          type: string
          readOnly: true
        certificate_date:
          type:
          - string
          - 'null'
          format: date
          readOnly: true
        amount_credited:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        tds_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        notes:
          type:
          - string
          - 'null'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount_credited
      - certificate_date
      - certificate_number
      - created_at
      - deductor_tan
      - fy_start_year
      - id
      - notes
      - party_id
      - quarter
      - section
      - tds_amount
      - updated_at
      - version
    TdsCertificateWrite:
      type: object
      properties:
        party_id:
          type: string
          format: uuid
          description: The client who deducted the TDS.
        deductor_tan:
          type: string
          description: The client's TAN, e.g. BLRS12345E.
        section:
          type: string
          default: 194C
          pattern: ^19[0-9]{1,2}[A-Z]{0,3}$
        fy_start_year:
          type: integer
          maximum: 2100
          minimum: 2000
          description: 2026 = FY 2026-27.
        quarter:
          type: integer
          maximum: 4
          minimum: 1
          description: 1 = Apr-Jun ... 4 = Jan-Mar.
        certificate_number:
          type: string
          pattern: ^[A-Za-z0-9/-]{1,20}$
        certificate_date:
          type:
          - string
          - 'null'
          format: date
        amount_credited:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: As the certificate states.
        tds_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        notes:
          type:
          - string
          - 'null'
          maxLength: 2000
      required:
      - certificate_number
      - deductor_tan
      - fy_start_year
      - party_id
      - quarter
      - tds_amount
    TdsReconciliation:
      type: object
      properties:
        fy_start_year:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/TdsRow'
        totals:
          $ref: '#/components/schemas/TdsTotals'
      required:
      - fy_start_year
      - results
      - totals
    TdsRow:
      type: object
      properties:
        party_id:
          type: string
          format: uuid
        display_name:
          type: string
        quarter:
          type: integer
        deductor_tans:
          type:
          - string
          - 'null'
        bill_count:
          type: integer
        taxable_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Of the bills with TDS in the quarter.
        expected:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: TDS deducted on our issued bills.
        certificate_count:
          type: integer
        certified:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: TDS as the Form 16A certificates state.
        difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: certified - expected
        status:
          $ref: '#/components/schemas/TdsRowStatusEnum'
        certificate_due:
          type: string
          format: date
          description: Form 16A is due 15 days after the return.
        overdue:
          type: boolean
      required:
      - bill_count
      - certificate_count
      - certificate_due
      - certified
      - deductor_tans
      - difference
      - display_name
      - expected
      - overdue
      - party_id
      - quarter
      - status
      - taxable_value
    TdsRowStatusEnum:
