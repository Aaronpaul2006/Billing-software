  /api/v1/documents:
    get:
      operationId: documents_list
      description: |-
        Permission by action name (docs/01-architecture.md §3): `read_action`
        for GET/HEAD/OPTIONS, `write_action` for everything else. Generic, so list
        endpoints get pagination and filtering from the DRF defaults.
      parameters:
      - in: query
        name: book
        schema:
          type: string
          enum:
          - ALL
          - GST
          - NON_GST
        description: |-
          * `GST` - GST
          * `NON_GST` - NON_GST
          * `ALL` - ALL
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: doc_date_from
        schema:
          type: string
          format: date
      - in: query
        name: doc_date_to
        schema:
          type: string
          format: date
      - in: query
        name: doc_type
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: due_date_to
        schema:
          type: string
          format: date
      - in: query
        name: is_ra_bill
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: party_id
        schema:
          type: string
          format: uuid
      - in: query
        name: payment_state
        schema:
          type: string
          enum:
          - PAID
          - PARTIAL
          - UNPAID
        description: |-
          * `UNPAID` - UNPAID
          * `PARTIAL` - PARTIAL
          * `PAID` - PAID
      - in: query
        name: project_id
        schema:
          type: string
          format: uuid
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - documents
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentListList'
